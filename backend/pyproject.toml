[project]
name = "iiosmap"
version = "0.1.0"
description = "iiosMap — La-Mulana gameplay map tracker with hotkey window capture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pillow>=11.0",
    "keyboard>=0.13.5",
    "pywin32>=308; platform_system == 'Windows'",
    "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
iiosmap = "iiosmap.__main__:main"
